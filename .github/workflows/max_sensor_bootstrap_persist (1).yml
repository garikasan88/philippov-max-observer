name: PHILIPPOV MAX SENSOR — PERSIST SESSION

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  persist:
    name: Persist SENSOR session
    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      MAX_STATE_KEY: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: QR login, verify SENSOR and persist encrypted session
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          npm init -y >/dev/null 2>&1
          npm install --silent --ignore-scripts --omit=optional --no-audit --no-fund webmaxsocket@1.2.7

          cat > persist-sensor.cjs <<'JS'
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { WebMaxClient } = require('webmaxsocket');

          const EXPECTED_USER_ID = '140053596';
          const STATE_TITLE = '[STATE] PHILIPPOV MAX OBSERVER V2 FINAL';
          const SESSION_NAME = 'philippov_max_observer_v2_final';
          const SESSION_FILE = path.join(process.cwd(), 'sessions', `${SESSION_NAME}.json`);

          const GH_TOKEN = String(process.env.GH_TOKEN || '');
          const GH_REPO = String(process.env.GH_REPO || '');
          const STATE_KEY = String(process.env.MAX_STATE_KEY || '').trim();

          if (!GH_TOKEN || !GH_REPO) throw new Error('GITHUB_CONTEXT_MISSING');
          if (!STATE_KEY) throw new Error('MAX_STATE_KEY_EMPTY');

          const API = `https://api.github.com/repos/${GH_REPO}`;

          async function gh(urlPath, { method = 'GET', body = null } = {}) {
            const res = await fetch(`${API}${urlPath}`, {
              method,
              headers: {
                Authorization: `Bearer ${GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
                'User-Agent': 'PHILIPPOV-MAX-SENSOR-PERSIST',
              },
              body: body == null ? undefined : JSON.stringify(body),
            });

            const text = await res.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch { data = text; }

            if (!res.ok) {
              throw new Error(`GitHub API ${method} ${urlPath}: HTTP ${res.status}`);
            }

            return data;
          }

          async function findIssueByTitle(title) {
            for (let page = 1; page <= 5; page++) {
              const rows = await gh(`/issues?state=all&per_page=100&page=${page}`);
              const hit = rows.find(x => !x.pull_request && x.title === title);
              if (hit) return hit;
              if (rows.length < 100) break;
            }
            return null;
          }

          function encryptionKey(secret) {
            return crypto
              .createHash('sha256')
              .update(`PHILIPPOV_MAX_OBSERVER_V2_FINAL\0${secret}`)
              .digest();
          }

          function keyId(secret) {
            return crypto
              .createHash('sha256')
              .update(`PHILIPPOV_MAX_OBSERVER_V2_FINAL_ID\0${secret}`)
              .digest('hex')
              .slice(0, 16);
          }

          function encryptSession(session, secret) {
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', encryptionKey(secret), iv);
            const cipherText = Buffer.concat([
              cipher.update(Buffer.from(JSON.stringify(session), 'utf8')),
              cipher.final(),
            ]);

            return {
              v: 1,
              keyId: keyId(secret),
              iv: iv.toString('base64'),
              tag: cipher.getAuthTag().toString('base64'),
              data: cipherText.toString('base64'),
            };
          }

          function stateBody(cursor, encryptedSession) {
            return [
              'PHILIPPOV MAX OBSERVER V2 FINAL — service state.',
              'MAX session below is AES-256-GCM encrypted.',
              '',
              '<!--PHILIPPOV_CURSOR_V2_FINAL',
              JSON.stringify(cursor),
              'PHILIPPOV_CURSOR_V2_FINAL-->',
              '',
              '<!--PHILIPPOV_SESSION_ENC_V2_FINAL',
              JSON.stringify(encryptedSession),
              'PHILIPPOV_SESSION_ENC_V2_FINAL-->',
            ].join('\n');
          }

          async function main() {
            console.log('SENSOR PERSIST: WAITING FOR QR SCAN');
            console.log('MAX: Профиль → Устройства / Безопасность → Подключить устройство → отсканируйте QR ниже.');

            const client = new WebMaxClient({
              name: SESSION_NAME,
              deviceType: 'WEB',
              saveToken: true,
              clearSessionOnFailedSync: false,
              sessionBackup: false,
              debug: false,
              logIncoming: false,
              maxReconnectAttempts: 0,
              timezone: 'Europe/Moscow',
            });

            await client.start();

            const actualUserId = String(
              client?.me?.id ?? client?.session?.get?.('userId') ?? 'UNKNOWN'
            );
            const actualName =
              client?.me?.fullname ||
              client?.me?.firstname ||
              'UNKNOWN';

            if (actualUserId !== EXPECTED_USER_ID) {
              throw new Error(
                `WRONG_SENSOR_ACCOUNT expected=${EXPECTED_USER_ID} got=${actualUserId}`
              );
            }

            console.log(`SENSOR LOGIN: PASS account=${actualName} user_id=${actualUserId}`);

            if (!fs.existsSync(SESSION_FILE)) {
              throw new Error('MAX_SESSION_FILE_NOT_CREATED');
            }

            const persistentSession = JSON.parse(fs.readFileSync(SESSION_FILE, 'utf8'));
            if (!persistentSession?.token || !persistentSession?.deviceId) {
              throw new Error('MAX_SESSION_FILE_INCOMPLETE');
            }

            const encrypted = encryptSession(persistentSession, STATE_KEY);
            const cursor = { version: 2, accountId: EXPECTED_USER_ID, chats: {} };

            let stateIssue = await findIssueByTitle(STATE_TITLE);

            if (!stateIssue) {
              stateIssue = await gh('/issues', {
                method: 'POST',
                body: {
                  title: STATE_TITLE,
                  body: stateBody(cursor, encrypted),
                },
              });
            } else {
              await gh(`/issues/${stateIssue.number}`, {
                method: 'PATCH',
                body: {
                  body: stateBody(cursor, encrypted),
                  state: 'closed',
                },
              });
            }

            console.log('SENSOR SESSION CHECKPOINT: PASS');
            console.log('SENSOR SESSION: ENCRYPTED_AND_PERSISTED');
            console.log('SENSOR PERSIST: COMPLETE');
            process.exit(0);
          }

          main().catch(err => {
            console.error(`SENSOR PERSIST: FAIL ${String(err?.message || err).slice(0, 800)}`);
            process.exit(1);
          });
          JS

          node --check persist-sensor.cjs
          timeout --signal=TERM --kill-after=5s 360s node persist-sensor.cjs
