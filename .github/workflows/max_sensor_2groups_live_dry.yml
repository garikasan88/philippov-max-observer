name: PHILIPPOV MAX SENSOR — 2 GROUP LIVE DRY

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: philippov-max-sensor-two-groups
  cancel-in-progress: false

jobs:
  sensor_live_dry:
    name: SENSOR two-group live dry
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      MAX_BOOTSTRAP_SECRET: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout current PASS observer
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build SENSOR variants from current observer and run both groups
        shell: bash
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/.github/workflows/observer.yml"
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          npm init -y >/dev/null 2>&1
          npm install --silent --ignore-scripts --omit=optional --no-audit --no-fund webmaxsocket@1.2.7

          python3 - "$SRC" "$WORKDIR" <<'PY'
          from pathlib import Path
          import sys

          src_path = Path(sys.argv[1])
          out_dir = Path(sys.argv[2])
          src = src_path.read_text(encoding="utf-8")

          marker_start = "cat > observer.cjs <<'JS'\n"
          marker_end = "\n          JS\n"

          if marker_start not in src or marker_end not in src:
              raise SystemExit("CURRENT_OBSERVER_JS_BLOCK_NOT_FOUND")

          start = src.index(marker_start) + len(marker_start)
          end = src.index(marker_end, start)
          js = src[start:end]

          old_uid = "const EXPECTED_USER_ID = '402668979';"
          old_cid = "const TARGET_CHAT_ID = '-78471339098233';"
          old_title = "const TARGET_CHAT_NAME_FALLBACK = 'СКАУТ ТЕСТ';"

          for needle in (old_uid, old_cid, old_title):
              if needle not in js:
                  raise SystemExit(f"CURRENT_OBSERVER_EXPECTED_MARKER_MISSING: {needle}")

          # On a brand-new SENSOR cursor, keep baseline protection (old rows are not
          # emitted as NEW) but continue into the read-only LIVE MATCH DRY in the
          # same run. This avoids a second MAX login just to leave baseline mode.
          b0 = js.index("if (!chatState?.initialized) {")
          b1 = js.index("const seen = new Set", b0)
          baseline = js[b0:b1]
          if "process.exit(0);" not in baseline:
              raise SystemExit("BASELINE_EXIT_NOT_FOUND")
          baseline = baseline.replace(
              "process.exit(0);",
              "chatState = cursor.chats[cid];\n"
              "                console.log('BASELINE CONTINUE: LIVE DRY CHECK');",
              1,
          )
          js = js[:b0] + baseline + js[b1:]

          variants = [
              ("requests", "-70193851621530", "ЗАПРОСЫ"),
              ("krasnodar", "-69236834721964", "Запросы Краснодар"),
          ]

          for tag, cid, title in variants:
              v = js
              v = v.replace(old_uid, "const EXPECTED_USER_ID = '140053596';", 1)
              v = v.replace(old_cid, f"const TARGET_CHAT_ID = '{cid}';", 1)
              v = v.replace(
                  old_title,
                  f"const TARGET_CHAT_NAME_FALLBACK = {title!r};",
                  1,
              )
              path = out_dir / f"observer_sensor_{tag}.cjs"
              path.write_text(v, encoding="utf-8")
              print(f"SENSOR VARIANT BUILT: {tag} chat_id={cid} title={title}")
          PY

          node --check observer_sensor_requests.cjs
          node --check observer_sensor_krasnodar.cjs
          echo "SENSOR VARIANT SYNTAX: PASS"

          echo "========== SENSOR GROUP 1: ЗАПРОСЫ =========="
          timeout --signal=TERM --kill-after=5s 100s node observer_sensor_requests.cjs

          echo "========== SENSOR GROUP 2: Запросы Краснодар =========="
          timeout --signal=TERM --kill-after=5s 100s node observer_sensor_krasnodar.cjs

          echo "PHILIPPOV MAX SENSOR TWO-GROUP LIVE DRY: COMPLETE"
