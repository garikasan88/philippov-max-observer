name: PHILIPPOV MAX OBSERVER — ONE-SHOT REPAIR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observer_repair_once.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Accept money-marker price without currency suffix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/observer_base.yml')
          s = p.read_text(encoding='utf-8')
          anchor = 'for (const m of raw.matchAll(/(\\d+(?:[.,]\\d+)?)\\s*(млн|миллион(?:а|ов)?)/giu)) {'
          marker = 'OBJECT_PRICE_MONEY_MARKER_FALLBACK'
          if marker in s:
              print('OBJECT_PRICE_MONEY_MARKER_FIX: ALREADY_PRESENT')
          else:
              if s.count(anchor) != 1:
                  raise SystemExit(f'OBJECT_PRICE_ANCHOR_COUNT={s.count(anchor)}')
              pos = s.index(anchor)
              line_start = s.rfind('\n', 0, pos) + 1
              indent = s[line_start:pos]
              block = (
                  indent + '// OBJECT_PRICE_MONEY_MARKER_FALLBACK\n' +
                  indent + 'for (const m of raw.matchAll(/💰\\s*(\\d{1,3}(?:\\s\\d{3}){1,2})(?!\\s*(?:м²|м2|сот|этаж))/giu)) {\n' +
                  indent + '  const v = Number(m[1].replace(/\\s/g, ""));\n' +
                  indent + '  if (v >= 500_000 && v <= 100_000_000) vals.push(v);\n' +
                  indent + '}\n'
              )
              s = s[:line_start] + block + s[line_start:]
              p.write_text(s, encoding='utf-8')
              print('OBJECT_PRICE_MONEY_MARKER_FIX: APPLIED')
          PY

          git diff --check
          grep -F 'OBJECT_PRICE_MONEY_MARKER_FALLBACK' src/observer_base.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/observer_base.yml
          if ! git diff --cached --quiet; then
            git commit -m "Accept MAX object price after money marker"
            git push origin HEAD:main
          fi

      - name: Dispatch clean production verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/max_observer_production.yml/dispatches" \
            -f ref="main"
          echo "CLEAN PRODUCTION VERIFY DISPATCH: PASS"
