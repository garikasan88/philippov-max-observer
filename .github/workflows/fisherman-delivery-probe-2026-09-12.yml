name: PHILIPPOV MAX OBSERVER — Fisherman delivery probe 2026-09-12

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fisherman-delivery-probe-2026-09-12.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MAX_BOOTSTRAP_SECRET: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Frozen Observer read-only delivery probe
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null 2>&1
          npm install --silent --ignore-scripts --omit=optional --no-audit --no-fund webmaxsocket@1.2.7

          python3 - "$GITHUB_WORKSPACE/src/observer_base.yml" "$WORKDIR/observer.cjs" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1]).read_text(encoding='utf-8')
          out = Path(sys.argv[2])
          start_marker = "          cat > observer.cjs <<'JS'\n"
          end_marker = "\n          JS\n"
          if start_marker not in src or end_marker not in src:
              raise SystemExit('OBSERVER_JS_BLOCK_NOT_FOUND')
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          js = src[start:end]

          replacements = [
              ("const EXPECTED_USER_ID = '402668979';", "const EXPECTED_USER_ID = '140053596';"),
              ("const TARGET_CHAT_ID = '-78471339098233';", "const TARGET_CHAT_ID = '-70194328199322';"),
              ("const TARGET_CHAT_NAME_FALLBACK = 'СКАУТ ТЕСТ';", "const TARGET_CHAT_NAME_FALLBACK = 'Алексей: Западный обход/СМР/ЭНКА';"),
              ("const HISTORY_BACKWARD = 500;", "const HISTORY_BACKWARD = 5000;"),
          ]
          for old, new in replacements:
              if old not in js:
                  raise SystemExit('PROBE_PATCH_MARKER_MISSING: ' + old)
              js = js.replace(old, new, 1)

          marker = "const ordered = [...history].sort((a, b) => messageTime(a) - messageTime(b));"
          if marker not in js:
              raise SystemExit('PROBE_ORDERED_MARKER_NOT_FOUND')

          probe = r'''
              const probeStart = Date.parse('2026-09-12T09:11:30Z');
              const probeEnd = Date.parse('2026-09-12T09:14:30Z');
              const toMs = value => {
                const n = Number(value || 0);
                return n > 0 && n < 10_000_000_000 ? n * 1000 : n;
              };
              const probeRows = history.filter(m => {
                const t = toMs(messageTime(m));
                return t >= probeStart && t <= probeEnd;
              });
              const probeMatches = probeRows.filter(m => {
                const n = normalizeText(messageText(m));
                return n.includes('жк италия') && n.includes('43 3');
              });
              console.log(`FISHERMAN DELIVERY PROBE: history=${history.length} inWindow=${probeRows.length} matches=${probeMatches.length}`);
              for (const m of probeMatches.slice(0, 5)) {
                const t = toMs(messageTime(m));
                console.log(`FISHERMAN MATCH: id=${messageId(m)} iso=${t ? new Date(t).toISOString() : 'UNKNOWN'}`);
              }
              console.log(probeMatches.length > 0
                ? 'DELIVERY VERDICT: PRESENT — DO NOT RETRY'
                : (probeRows.length > 0
                    ? 'DELIVERY VERDICT: ABSENT_IN_READABLE_WINDOW'
                    : 'DELIVERY VERDICT: INCONCLUSIVE_EMPTY_WINDOW'));
              process.exit(0);
          '''
          js = js.replace(marker, probe + "\n              " + marker, 1)
          out.write_text(js, encoding='utf-8')
          print('FROZEN OBSERVER PROBE BUILD: PASS')
          PY

          node --check observer.cjs
          node observer.cjs
