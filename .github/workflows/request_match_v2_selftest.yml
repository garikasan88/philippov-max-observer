name: PHILIPPOV REQUEST MATCH V2 — ONE-SHOT SELFTEST

on:
  push:
    paths:
      - '.github/workflows/request_match_v2_selftest.yml'
      - '.github/workflows/max_observer_production.yml'
      - 'src/request_match_v2_patch.js'
      - 'src/request_match_v2_hotfix.js'
      - 'src/request_match_v21_real_requests_hotfix.js'
      - 'src/request_match_v21_production_overlay.py'
      - 'src/max_observer_production_base.yml'
      - 'src/next_action_lifecycle_overlay.py'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: dummy
      GH_REPO: dummy/dummy
      GH_OWNER: dummy
      GH_RUN_URL: dummy
      MAX_BOOTSTRAP_SECRET: dummy-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build isolated V2 selftest from frozen observer
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent --ignore-scripts --omit=optional --no-audit --no-fund webmaxsocket@1.2.7

          python3 - <<'PY'
          from pathlib import Path

          src = Path('src/observer_base.yml').read_text(encoding='utf-8')
          patch = Path('src/request_match_v2_patch.js').read_text(encoding='utf-8')
          hotfix = Path('src/request_match_v2_hotfix.js').read_text(encoding='utf-8')
          real_hotfix = Path('src/request_match_v21_real_requests_hotfix.js').read_text(encoding='utf-8')
          start_marker = "cat > observer.cjs <<'JS'\n"
          end_marker = "\n          JS\n"
          if start_marker not in src or end_marker not in src:
              raise SystemExit('OBSERVER_JS_BLOCK_NOT_FOUND')

          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          js = src[start:end]

          main_marker = "\n          async function main() {"
          if main_marker not in js:
              raise SystemExit('MAIN_INSERT_POINT_NOT_FOUND')
          js = js.replace(main_marker, "\n" + patch + "\n" + hotfix + "\n" + real_hotfix + "\n" + main_marker, 1)

          invoke_marker = "\n          main().catch(error => {"
          invoke = js.rfind(invoke_marker)
          if invoke < 0:
              raise SystemExit('MAIN_INVOKE_NOT_FOUND')

          selftest_lines = [
              "console.log('BASE+V2 PARSER: ' + parserSelfTest());",
              "console.log('MVP SCOPE: ' + mvpScopeSelfTest());",
              "console.log('OBJECT MATCH: ' + objectMatchSelfTest());",
              "console.log('OBJECT TYPE: ' + objectTypeSelfTest());",
              "const __activeParseObservedMessageForFrozenV2 = parseObservedMessage;",
              "try {",
              "  parseObservedMessage = __v21ParseObservedMessageBase;",
              "  console.log('REQUEST MATCH V2 FROZEN: ' + requestMatchV2SelfTest());",
              "} finally {",
              "  parseObservedMessage = __activeParseObservedMessageForFrozenV2;",
              "}",
              "console.log('REQUEST MATCH V2.1: ' + requestMatchV21SelfTest());",
              "console.log('REQUEST MATCH V2.1 REAL: ' + requestMatchV21RealRequestsSelfTest());",
              "console.log('NEXT ACTION LIFECYCLE: ' + nextActionLifecycleSelfTest());",
              "console.log('REQUEST MATCH V2/V2.1 ONE-SHOT: PASS');",
          ]
          js = js[:invoke] + "\n" + "\n".join(selftest_lines) + "\n"

          Path('.request_match_v2_selftest.cjs').write_text(js, encoding='utf-8')
          PY

          node --check .request_match_v2_selftest.cjs
          node .request_match_v2_selftest.cjs

          python3 - <<'PY'
          from pathlib import Path

          prod = Path('src/max_observer_production_base.yml').read_text(encoding='utf-8')

          next_overlay_path = Path('src/next_action_lifecycle_overlay.py')
          next_ns = {}
          exec(compile(next_overlay_path.read_text(encoding='utf-8'), str(next_overlay_path), 'exec'), next_ns)
          apply_next = next_ns.get('apply_next_action_lifecycle_overlay')
          if not callable(apply_next):
              raise SystemExit('NEXT_ACTION_OVERLAY_FUNCTION_MISSING')
          effective = apply_next(prod)

          v21_overlay_path = Path('src/request_match_v21_production_overlay.py')
          v21_ns = {}
          exec(compile(v21_overlay_path.read_text(encoding='utf-8'), str(v21_overlay_path), 'exec'), v21_ns)
          apply_v21 = v21_ns.get('apply_request_match_v21_production_overlay')
          if not callable(apply_v21):
              raise SystemExit('V21_PRODUCTION_OVERLAY_FUNCTION_MISSING')
          effective = apply_v21(effective)

          required = [
              "request_match_v21_real_requests_hotfix.js",
              "const matchView = v21MatchedRequestView(m.request || {}, m.reasons || []);",
              "`Подзапрос: ${matchView.index} из ${matchView.total || '?'}`",
              "clip(matchView.raw || req.raw, 850)",
              "m.reasons.filter(x => !/^SUBREQUEST:\\d+$/u.test(String(x || '').trim()))",
              "const legacyMatchKey = v21LegacyMatchKey(m, cid);",
              "const matchKey = v21CrossGroupMatchKey(m, cid);",
              "notifiedKeys.add(legacyMatchKey);",
              "nextActionCreate({sourceMatchKey: matchKey})",
              "const nextActionDisplayText = requestAuthor",
              "cursor.nextActions[nextAction.id] = nextAction",
              "cursor.nextActionEvents.push({type:'CREATED'",
              "cursor.auditEvents.push({type:'NEXT_ACTION_CREATED'",
              "const controlSenderId = senderId(cm);",
              "controlSenderId === EXPECTED_USER_ID",
              "nextActionParseCommand(controlText)",
              "nextActionApplyCommand(cursor.nextActions, controlText",
              "cursor.nextActionEvents.push({type:'STATUS_CHANGED'",
              "cursor.auditEvents.push({type:'NEXT_ACTION_STATUS_CHANGED'",
              "`ID: ${nextAction.id}`",
              "`Статус: ${nextAction.status}`",
              "`Управление: СКАУТ ${nextAction.id} В РАБОТУ / ГОТОВО / ОТКЛОНИТЬ`",
              "const MAX_NEW_MATCH_NOTIFICATIONS_PER_RUN = 20;",
              "MATCH NOTIFY FLOOD GUARD: BLOCKED",
              "type:'MATCH_NOTIFIED'",
              "MATCH NOTIFY CHECKPOINT: PASS",
              "const encryptedMatches = encryptSession(notifyMatches, BOOTSTRAP_RAW);",
          ]
          missing = [needle for needle in required if needle not in effective]
          if missing:
              raise SystemExit('PRODUCTION_V21_HARDENING_MISSING: ' + repr(missing))

          forbidden = [
              "nextActionCreate({sourceMatchKey: matchKey, requestAuthor})",
              "text: requestAuthor\n",
          ]
          leaked = [needle for needle in forbidden if needle in effective]
          if leaked:
              raise SystemExit('PUBLIC_STATE_PRIVACY_REGRESSION: ' + repr(leaked))

          active = Path('.github/workflows/max_observer_production.yml').read_text(encoding='utf-8')
          active_required = [
              'src/next_action_lifecycle_overlay.py',
              'src/request_match_v21_production_overlay.py',
              'apply_next_action_lifecycle_overlay',
              'apply_request_match_v21_production_overlay',
              'NEXT ACTION LIFECYCLE OVERLAY: READY',
              'REQUEST MATCH V2.1 PRODUCTION OVERLAY: READY',
          ]
          missing_active = [needle for needle in active_required if needle not in active]
          if missing_active:
              raise SystemExit('ACTIVE_PRODUCTION_OVERLAY_WIRING_MISSING: ' + repr(missing_active))

          print('PRODUCTION MATCH + V2.1 REAL REQUEST + NEXT ACTION HARDENING: PASS')
          PY
