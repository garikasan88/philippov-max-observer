name: PHILIPPOV MAX current registry refresh v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/max_group_registry_refresh2_2026_09_12.yml'
      - 'scripts/max_group_registry_refresh2_2026_09_12.cjs'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  group_export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAX_BOOTSTRAP_SECRET: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install MAX client
        run: npm install --silent --ignore-scripts --omit=optional --no-audit --no-fund webmaxsocket@1.2.7
      - name: Export current group registry read-only and encrypt
        run: node scripts/max_group_registry_refresh2_2026_09_12.cjs
      - name: Upload encrypted export
        uses: actions/upload-artifact@v4
        with:
          name: max-groups-current2-encrypted
          path: .export/max-groups-current2.envelope.json
          if-no-files-found: error
          retention-days: 1
