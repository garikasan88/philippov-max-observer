name: NP Next chunk probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/np_next_chunk_probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract category RPC payloads
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          curl -L --max-time 30 -A 'Mozilla/5.0' -sS 'https://app.neprostobot.ru/_next/static/chunks/0og-vp.lhzrrv.js' -o np.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/np.js').read_text('utf-8',errors='ignore')
          print('BYTES',len(t))
          for method in ['getAutoCategoryPlan','applyAutoCategories','revertAutoCategories','dismissAutoCategoryPrompt','saveCustomCategories','updateGroupCategories']:
              start=0; hit=0
              while True:
                  pos=t.find(method,start)
                  if pos<0: break
                  hit+=1
                  a=max(0,pos-2600); b=min(len(t),pos+4200)
                  s=re.sub(r'\s+',' ',t[a:b])
                  print(f'\n=== {method} HIT {hit} POS {pos} ===\n{s}')
                  start=pos+len(method)
              print('COUNT',method,hit)

          # Pull compact literal RPC call expressions for exact arg arrays.
          print('\n=== COMPACT RPC CALLS ===')
          pat=re.compile(r'nh\((.{0,180}?),\s*["\'](getAutoCategoryPlan|applyAutoCategories|revertAutoCategories|dismissAutoCategoryPrompt|saveCustomCategories|updateGroupCategories)["\']\s*,\s*(\[[\s\S]{0,700}?\])\)',re.M)
          for m in pat.finditer(t):
              print(m.group(2),'BASE=',re.sub(r'\s+',' ',m.group(1)),'ARGS=',re.sub(r'\s+',' ',m.group(3)))
          PY