name: NP Next chunk probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/np_next_chunk_probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract category RPC methods
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          curl -L --max-time 30 -A 'Mozilla/5.0' -sS 'https://app.neprostobot.ru/_next/static/chunks/0og-vp.lhzrrv.js' -o np.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/np.js').read_text('utf-8',errors='ignore')
          print('BYTES',len(t))

          def ctx(label, needle, before=1800, after=3200, max_hits=12):
              low=t.lower(); q=needle.lower(); start=0; count=0
              while count<max_hits:
                  pos=low.find(q,start)
                  if pos<0: break
                  a=max(0,pos-before); b=min(len(t),pos+after)
                  s=re.sub(r'\s+',' ',t[a:b])
                  s=re.sub(r'(?i)(authorization|cookie|secret|token)(.{0,8})[A-Za-z0-9._~-]{40,}',r'\1\2[redacted]',s)
                  print(f'\n=== {label} HIT {count+1} POS {pos} ===\n{s}')
                  start=pos+len(q); count+=1
              print(f'COUNT {label} {count}')

          # Exact UI phrases and handler names around the feature.
          for label,needle in [
              ('AUTO_HANDLER','onAutoCategorize'),
              ('AUTO_WORD','autoCategorize'),
              ('DIALOG_TITLE','Разложить по категориям'),
              ('UNCATEGORIZED','Группы без категории'),
              ('CHECK_RESULT','Проверьте результат'),
              ('REDISTRIBUTE','Перераспределить все группы'),
              ('DISTRIBUTE_BUTTON','Распределить'),
              ('SET_GROUP_CATEGORIES','setGroupCategories'),
              ('MOVE_GROUPS','moveGroups'),
              ('ADD_CATEGORY','addCategory'),
              ('DELETE_CATEGORY','deleteCategory'),
          ]:
              ctx(label,needle)

          # Extract literal method names passed through the tenant RPC helper nh(..., "method", ...).
          methods=[]
          for m in re.finditer(r'nh\([^,]{1,120},\s*["\']([^"\']+)["\']\s*,',t):
              name=m.group(1)
              if name not in methods: methods.append(name)
          print('\n=== RPC_LITERAL_METHODS ===')
          for name in methods:
              if any(k in name.lower() for k in ['group','categor','sync','max','telegram','broadcast','advert','stat']):
                  print(name)

          # Extract all quoted identifier-like strings mentioning categorize/category to catch indirect dispatch maps.
          vals=[]
          for m in re.finditer(r'["\']([A-Za-z][A-Za-z0-9_]{2,80})["\']',t):
              v=m.group(1)
              if ('categor' in v.lower() or 'group' in v.lower()) and v not in vals:
                  vals.append(v)
          print('\n=== CATEGORY_GROUP_IDENTIFIERS ===')
          for v in vals: print(v)

          # Helper definition / endpoint builder.
          for pat in [r'function\s+nh\s*\(', r'\bnh\s*=\s*async', r'\bnh\s*=\s*\(']:
              m=re.search(pat,t)
              if m:
                  pos=m.start(); s=re.sub(r'\s+',' ',t[max(0,pos-1200):min(len(t),pos+3500)])
                  print('\n=== NH_DEFINITION ===\n',s)
                  break
          PY