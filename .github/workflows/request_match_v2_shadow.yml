name: PHILIPPOV REQUEST MATCH V2 — LIVE SHADOW

on:
  push:
    paths:
      - '.github/workflows/request_match_v2_shadow.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: philippov-request-match-v2-live-shadow
  cancel-in-progress: false

jobs:
  shadow:
    name: 2 groups → V2 parser → objects → MATCH DRY
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      MAX_BOOTSTRAP_SECRET: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build V2 shadow variants and run both request groups
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          npm init -y >/dev/null 2>&1
          npm install --silent --ignore-scripts --omit=optional --no-audit --no-fund webmaxsocket@1.2.7

          python3 - "$GITHUB_WORKSPACE/src/observer_base.yml" "$GITHUB_WORKSPACE/src/request_match_v2_patch.js" "$GITHUB_WORKSPACE/src/request_match_v2_hotfix.js" "$WORKDIR" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1]).read_text(encoding='utf-8')
          patch = Path(sys.argv[2]).read_text(encoding='utf-8')
          hotfix = Path(sys.argv[3]).read_text(encoding='utf-8')
          out_dir = Path(sys.argv[4])

          marker_start = "cat > observer.cjs <<'JS'\n"
          marker_end = "\n          JS\n"
          if marker_start not in src or marker_end not in src:
              raise SystemExit('OBSERVER_JS_BLOCK_NOT_FOUND')
          start = src.index(marker_start) + len(marker_start)
          end = src.index(marker_end, start)
          js = src[start:end]

          main_marker = "\n          async function main() {"
          if main_marker not in js:
              raise SystemExit('MAIN_INSERT_POINT_NOT_FOUND')
          js = js.replace(main_marker, "\n" + patch + "\n" + hotfix + "\n" + main_marker, 1)

          old_uid = "const EXPECTED_USER_ID = '402668979';"
          old_cid = "const TARGET_CHAT_ID = '-78471339098233';"
          old_title = "const TARGET_CHAT_NAME_FALLBACK = 'СКАУТ ТЕСТ';"
          for needle in (old_uid, old_cid, old_title):
              if needle not in js:
                  raise SystemExit(f'EXPECTED_MARKER_MISSING: {needle}')

          b0 = js.index("if (!chatState?.initialized) {")
          b1 = js.index("const seen = new Set", b0)
          baseline = js[b0:b1]
          if "process.exit(0);" in baseline:
              baseline = baseline.replace(
                  "process.exit(0);",
                  "chatState = cursor.chats[cid];\n                console.log('BASELINE CONTINUE: V2 LIVE SHADOW');",
                  1,
              )
              js = js[:b0] + baseline + js[b1:]

          variants = [
              ('requests', '-70193851621530', 'ЗАПРОСЫ'),
              ('krasnodar', '-69236834721964', 'Запросы Краснодар'),
          ]
          for tag, cid, title in variants:
              v = js.replace(old_uid, "const EXPECTED_USER_ID = '140053596';", 1)
              v = v.replace(old_cid, f"const TARGET_CHAT_ID = '{cid}';", 1)
              v = v.replace(old_title, f"const TARGET_CHAT_NAME_FALLBACK = {title!r};", 1)
              path = out_dir / f'v2_shadow_{tag}.cjs'
              path.write_text(v, encoding='utf-8')
              print(f'V2 SHADOW VARIANT BUILT: {tag} chat_id={cid} title={title}')
          PY

          node --check v2_shadow_requests.cjs
          node --check v2_shadow_krasnodar.cjs
          echo 'V2 SHADOW SYNTAX: PASS'

          echo '========== V2 SHADOW GROUP 1: ЗАПРОСЫ =========='
          timeout --signal=TERM --kill-after=5s 100s node v2_shadow_requests.cjs

          echo '========== V2 SHADOW GROUP 2: Запросы Краснодар =========='
          timeout --signal=TERM --kill-after=5s 100s node v2_shadow_krasnodar.cjs

          echo 'PHILIPPOV REQUEST MATCH V2 LIVE SHADOW: COMPLETE'
