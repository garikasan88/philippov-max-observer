name: NEPROSTOBOT public frontend probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/neprostobot_public_bundle_probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public app frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/np && cd /tmp/np
          curl -L --max-time 30 -A 'Mozilla/5.0' -sS -D headers.txt -o index.html 'https://app.neprostobot.ru/' || true
          echo '=== INDEX SIZE ==='
          wc -c index.html || true
          echo '=== HEADERS ==='
          sed -n '1,40p' headers.txt | sed -E 's/(set-cookie:).*/\1 [redacted]/I'
          echo '=== INDEX HTML ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text('utf-8',errors='ignore') if Path('index.html').exists() else ''
          t=re.sub(r'(?i)(value=["\'])[^"\']*(["\'])',r'\1[redacted]\2',t)
          t=re.sub(r'(?i)(csrf[^<>=]*[=:]["\']?)[A-Za-z0-9._-]+',r'\1[redacted]',t)
          print(t[:12000])
          PY