              // LIVE OBJECT SOURCE + MATCH DRY
              const objectChat = await discoverChatByExactTitle(client, OBJECT_CHAT_TITLE);
              if (!objectChat?.id) throw new Error(`OBJECT_CHAT_NOT_FOUND title=${OBJECT_CHAT_TITLE}`);
              const objectCid = String(objectChat.id);
              const objectHistory = await client.getHistory(Number(objectCid), Date.now(), HISTORY_BACKWARD, 0);
              if (!Array.isArray(objectHistory)) throw new Error('OBJECT_HISTORY_NOT_ARRAY');

              // SAFE OBJECT SOURCE DIAGNOSTIC v1.4.2
              // No RAW object text, sender names/IDs, message IDs, or exact prices are logged.
              // Purpose: explain why visible object messages fail parseObjectMessage:
              // EMPTY_TEXT -> NO_TYPE / NO_PRICE -> ACCEPT.
              const objectDiagNowMs = Date.now();
              const objectDiagRows = objectHistory.map((m, index) => {
                const rawTime = messageTime(m);
