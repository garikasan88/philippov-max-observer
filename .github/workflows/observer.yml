                  rawContentType: valueType(m?.rawData?.content),
                  rawCaptionType: valueType(m?.rawData?.caption),
                  rawTimestampType: valueType(m?.rawData?.timestamp),
                  rawTimeType: valueType(m?.rawData?.time),
