                .filter(r => r.t >= objectRawWindowStartMs && r.t <= objectRawWindowEndMs);

              const objectRawShapeGroups = new Map();
              for (const row of objectRawTargetRows) {
                const key = JSON.stringify(row.shape);
                const got = objectRawShapeGroups.get(key) || {
                  count: 0,
                  indices: [],
                  firstTime: null,
                  lastTime: null,
                  textLens: new Set(),
