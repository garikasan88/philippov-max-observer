name: MAX Observer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: max-observer-continuous
  cancel-in-progress: false

jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Restore MAX session
        env:
          MAX_SESSION: ${{ secrets.MAX_SESSION }}
        run: printf '%s' "$MAX_SESSION" > .max-session.json

      - name: One MAX check
        shell: bash
        run: |
          set -euo pipefail

          hour=$((10#$(TZ=Europe/Moscow date +%H)))

          echo "МОСКОВСКОЕ ВРЕМЯ: $(TZ=Europe/Moscow date)"

          if (( hour >= 22 || hour < 6 )); then

            echo "НОЧНОЙ РЕЖИМ MAX: 22:00–06:00"
            echo "MAX НЕ ПРОВЕРЯЕМ"

            now=$(TZ=Europe/Moscow date +%s)

            if (( hour >= 22 )); then
              target=$(TZ=Europe/Moscow date -d 'tomorrow 06:00:00' +%s)
            else
              target=$(TZ=Europe/Moscow date -d 'today 06:00:00' +%s)
            fi

            wait_seconds=$((target - now))

            # GitHub job не держим всю ночь одним куском.
            if (( wait_seconds > 14400 )); then
              wait_seconds=14400
            fi

            if (( wait_seconds > 0 )); then
              echo "MAX СПИТ. ЖДЁМ $wait_seconds СЕКУНД."
              sleep "$wait_seconds"
            fi

          else

            lookback=40

            # Утренняя проверка забирает сообщения за ночь.
            if (( hour == 6 )); then
              lookback=540
              echo "УТРЕННИЙ ДОБОР НОЧНЫХ СООБЩЕНИЙ"
            fi

            echo "ГЛУБИНА ПРОВЕРКИ: $lookback МИНУТ"

            LOOKBACK_MINUTES="$lookback" node observer.mjs

            echo "ПРОВЕРКА MAX ЗАВЕРШЕНА"
            echo "СЛЕДУЮЩАЯ ПРОВЕРКА ЧЕРЕЗ 30 МИНУТ"

            sleep 1800
          fi

      - name: Start next MAX check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run observer.yml --ref main
