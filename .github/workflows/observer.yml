          async function main() {
            let client = null;
            try {
              const parserStatus = parserSelfTest();
              console.log(`REQUEST PARSER SELFTEST: ${parserStatus}`);

              // GitHub preflight BEFORE MAX login, so a rotated token is never lost
              // because of a missing GitHub permission.
              let stateIssue = await findIssueByTitle(STATE_TITLE);
              const initialCursor = stateIssue ? parseCursor(stateIssue.body) : { version: 2, chats: {} };
              const encrypted = stateIssue ? parseEncryptedSession(stateIssue.body) : null;
              const restoredSession = decryptSession(encrypted, BOOTSTRAP_RAW);

              if (!stateIssue) {
                stateIssue = await ensureIssue(STATE_TITLE, stateBody(initialCursor, null));
                await gh(`/issues/${stateIssue.number}`, { method: 'PATCH', body: { state: 'closed' } });
              }

              const feedIssue = await ensureIssue(
                FEED_TITLE,
                [
                  `@${GH_OWNER}`,
                  '',
                  'PHILIPPOV MAX OBSERVER V2 FINAL',
                  'READ ONLY',
                  'PUBLIC REPO SAFETY: RAW MAX TEXT IS STORED ONLY ENCRYPTED',
                  `TARGET CHAT: ${TARGET_CHAT_NAME_FALLBACK} [${TARGET_CHAT_ID}]`,
                ].join('\n'),
              );

              fs.mkdirSync(path.dirname(SESSION_FILE), { recursive: true });
              if (restoredSession && typeof restoredSession === 'object') {
                fs.writeFileSync(SESSION_FILE, JSON.stringify(restoredSession, null, 2), 'utf8');
                console.log('SESSION RESTORE: PASS');
              } else {
                console.log('SESSION RESTORE: bootstrap');
              }

              const tokenForRun = restoredSession?.token
                ? String(restoredSession.token).trim()
                : BOOTSTRAP_TOKEN;

              if (!tokenForRun) throw new Error('NO_TOKEN_FOR_MAX_LOGIN');

              client = new WebMaxClient({
                name: SESSION_NAME,
                token: tokenForRun,
                deviceType: 'WEB',
                saveToken: true,
                clearSessionOnFailedSync: false,
                sessionBackup: true,
                debug: false,
                logIncoming: false,
                maxReconnectAttempts: 0,
                reconnectDelay: 1000,
                timezone: 'Europe/Moscow',
              });

              await client.start();

              const actualUserId = String(
                client?.me?.id ?? client?.session?.get?.('userId') ?? 'UNKNOWN'
              );
              const actualName =
                client?.me?.fullname ||
                client?.me?.firstname ||
                'UNKNOWN';

              if (actualUserId !== EXPECTED_USER_ID) {
                throw new Error(
                  `WRONG_MAX_ACCOUNT expected=${EXPECTED_USER_ID} got=${actualUserId}`
                );
              }

              console.log(`MAX LOGIN: PASS account=${actualName} user_id=${actualUserId}`);

              if (!fs.existsSync(SESSION_FILE)) {
                throw new Error('MAX_SESSION_FILE_NOT_CREATED');
              }

              // IMPORTANT: persist rotated token + stable deviceId IMMEDIATELY after login,
              // before chat/history work. This closes the failure mode of V1.
              let persistentSession = JSON.parse(fs.readFileSync(SESSION_FILE, 'utf8'));
              if (!persistentSession?.token || !persistentSession?.deviceId) {
                throw new Error('MAX_SESSION_FILE_INCOMPLETE');
              }
              await saveState(stateIssue.number, initialCursor, persistentSession);
              console.log('SESSION CHECKPOINT AFTER LOGIN: PASS');

              const cursor = initialCursor;
              const cid = TARGET_CHAT_ID;
              let chatState = cursor.chats[cid];
              let group = chatState?.group || TARGET_CHAT_NAME_FALLBACK;

              try {
                const info = await client.getChatInfo([Number(cid)]);
                const chats = info?.chats || info?.payload?.chats || (Array.isArray(info) ? info : []);
                const hit = Array.isArray(chats)
                  ? chats.find(x => String(x?.id) === cid)
                  : null;
                if (hit?.title) group = String(hit.title);
              } catch (e) {
                console.log(`CHAT INFO WARN: ${e.message}`);
              }

              const history = await client.getHistory(Number(cid), Date.now(), HISTORY_BACKWARD, 0);
              if (!Array.isArray(history)) throw new Error('MAX_HISTORY_NOT_ARRAY');

              const ordered = [...history].sort((a, b) => messageTime(a) - messageTime(b));

              if (!chatState?.initialized) {
                const ids = ordered.map(messageId).filter(Boolean);
                const maxTime = ordered.reduce((mx, m) => Math.max(mx, messageTime(m)), 0);
                cursor.chats[cid] = {
                  initialized: true,
                  lastTime: maxTime || Date.now(),
                  seenIds: compactSeen(ids),
                  group,
                };
                cursor.version = 2;
                cursor.accountId = EXPECTED_USER_ID;
                cursor.updatedAt = new Date().toISOString();
                await saveState(stateIssue.number, cursor, persistentSession);

                await gh(`/issues/${feedIssue.number}/comments`, {
                  method: 'POST',
                  body: {
                    body: `@${GH_OWNER}\n\nMAX OBSERVER V2 FINAL — BASELINE PASS. Старые сообщения не отправлены как новые.`,
                  },
                });

                console.log(`BASELINE: PASS messages=${ordered.length}`);
                await closeBlocker();
                console.log('PHILIPPOV MAX OBSERVER FINAL: PASS');
                process.exit(0);
              }

              const seen = new Set(compactSeen(chatState.seenIds));
              const lastTime = Number(chatState.lastTime || 0);
              const nextSeen = [...seen];
              const rows = [];
              let maxTime = lastTime;

              for (const m of ordered) {
                const id = messageId(m) ||
                  `t:${messageTime(m)}:${senderId(m)}:${messageText(m).slice(0, 80)}`;
                const t = messageTime(m);

                maxTime = Math.max(maxTime, t);
                if (seen.has(id)) continue;
                if (t && t < lastTime) continue;

                nextSeen.push(id);
                if (senderId(m) === EXPECTED_USER_ID) continue;

                rows.push({
                  group,
                  chatId: cid,
                  sender: senderName(m),
                  senderId: senderId(m),
                  messageId: id,
                  time: iso(t),
                  raw: messageText(m),
                  parsed: parseRequest(messageText(m)),
                });
              }

              cursor.chats[cid] = {
                initialized: true,
                lastTime: maxTime,
                seenIds: compactSeen(nextSeen),
                group,
              };
              cursor.version = 2;
              cursor.accountId = EXPECTED_USER_ID;
              cursor.updatedAt = new Date().toISOString();

              // Read the session again in case MAX rotated it during the history request.
              persistentSession = JSON.parse(fs.readFileSync(SESSION_FILE, 'utf8'));
              await saveState(stateIssue.number, cursor, persistentSession);

              if (rows.length) {
                const parserCounts = rows.reduce((acc, row) => {
                  const k = row?.parsed?.kind || 'UNKNOWN';
                  acc[k] = (acc[k] || 0) + 1;
                  return acc;
                }, {});
                console.log(`REQUEST PARSER BATCH: ${JSON.stringify(parserCounts)}`);

                // Repository is public: never publish RAW MAX text in plaintext.
                // Persist the whole batch encrypted with the MAX_SESSION-derived AES-256-GCM key.
                const encryptedFeed = encryptSession(rows, BOOTSTRAP_RAW);
                await gh(`/issues/${feedIssue.number}/comments`, {
                  method: 'POST',
                  body: {
                    body: [
                      `@${GH_OWNER}`,
                      '',
                      `MAX OBSERVER: ${rows.length} NEW MESSAGE(S) — ENCRYPTED`,
                      '<!--PHILIPPOV_ENCRYPTED_FEED_V1',
                      JSON.stringify(encryptedFeed),
                      'PHILIPPOV_ENCRYPTED_FEED_V1-->',
                    ].join('\n'),
                  },
                });
                console.log(`OBSERVER CHECK: PASS new_messages=${rows.length}`);
              } else {
                console.log('OBSERVER CHECK: PASS new_messages=0');
              }

              await closeBlocker();
              console.log('PHILIPPOV MAX OBSERVER FINAL: PASS');
              process.exit(0);
            } catch (error) {
              try { await blocker(error); } catch (e) {
                console.error(`BLOCKER NOTIFY FAILED: ${e.message}`);
              }
                            console.error(`MAX OBSERVER V2 FINAL FAILED: ${error?.message || error}`);
              process.exit(1);
            }
          }

          main().catch(error => {
            console.error(`MAX OBSERVER V2 FINAL FATAL: ${error?.message || error}`);
            process.exit(1);
          });
