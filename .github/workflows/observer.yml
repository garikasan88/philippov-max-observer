              finance:{mortgage, familyMortgage, cash, bankSber}, financeBudgets, typeBudgets, bigKitchen, minBedrooms, firstPrice, preferences,
            };
          }
          
          

          // ============================================================
          // MVP PRODUCTION SCOPE FILTER v1.0 — 05.09.2026
          // KEEP: apartment requests + ready/resale house requests.
          // IGNORE: developer/newbuild houses, land-only, commercial,
          // broad investment fishing, promo/info/advertising posts.
          // Core 61-case parser remains intact; this is a production gate on top.
          // ============================================================
          function applyMvpScope(core, text) {
            const raw = String(text ?? "").trim();
            const norm = normalizeText(raw);

            const promoInfo =
              /(?:удобн[а-яёa-z]*\s+сайт\s+для\s+поиска\s+недвиж|актуальн[а-яёa-z]*\s+прайс|ежедневн[а-яёa-z]*\s+рассылк|реклам[а-яёa-z]*\s+в\s+групп|наш\s+max\s+канал|подписывай[а-яёa-z]*\s+на\s+сообществ|сайт\s+с\s+объектами|прайс\s+квартир)/iu.test(raw) ||
              (/(?:https?:\/\/|www\.)/iu.test(raw) && /(?:прайс|канал|рассылк|реклам|сайт|подписывай)/iu.test(raw));
            if (promoInfo) return {kind:"IGNORE", reason:"PROMO_INFO", coreKind:core?.kind || "UNKNOWN"};

            const broadInvestor =
              /(?:выгодн[а-яёa-z]*\s+влож|инвестир[а-яёa-z]*|инвестиц[а-яёa-z]*)/iu.test(raw) &&
              /(?:участок|земл|коммерц|дом|квартир)/iu.test(raw) &&
              /(?:ликвидн|ниже\s+рынк|срочн[а-яёa-z]*\s+продаж|интересн[а-яёa-z]*\s+объект|присылайте\s+(?:ваши\s+)?(?:экс|вариант|объект))/iu.test(raw);
            if (broadInvestor) return {kind:"IGNORE", reason:"BROAD_INVESTOR_REQUEST", coreKind:core?.kind || "UNKNOWN"};

            if (!core || core.kind !== "REQUEST") return core;

            const types = Array.isArray(core.types) ? core.types : [];
            if (types.includes("commercial") || /(?:коммерц|общепит|нежил)/iu.test(norm)) {
              return {kind:"IGNORE", reason:"OUT_OF_SCOPE_COMMERCIAL", coreKind:core.kind};
            }

            const landOnly = /(?:участок|земл[а-яёa-z]*)/iu.test(raw) &&
              !/(?:квартир|студ|одноком|двуш|тр[её]ш|евро\s*[- ]?2|(?:^|\s)\d\s*[- ]?(?:к|ком)|дом|коттедж|таунхаус)/iu.test(raw);
            if (landOnly) return {kind:"IGNORE", reason:"OUT_OF_SCOPE_LAND", coreKind:core.kind};

            const apartmentTypes=["studio","1k","euro2","2k","3k"];
            const hasApartment=types.some(t=>apartmentTypes.includes(t));
            const hasReadyHouse=types.includes("house");
            if (!hasApartment && !hasReadyHouse) return {kind:"IGNORE", reason:"OUT_OF_SCOPE_OTHER", coreKind:core.kind};
            return core;
          }

          function parseObservedMessage(text) {
            return applyMvpScope(parseRequest(text), text);
          }

          function mvpScopeSelfTest() {
            const fail=(name,detail='')=>{throw new Error(`MVP SCOPE SELFTEST ${name}${detail?': '+detail:''}`)};
            let x;
            x=parseObservedMessage("ИНФОРМАЦИЯ. Удобный сайт для поиска недвижимости. ПРАЙС. Подписывайся на сообщество, ежедневная рассылка, реклама в группах.");
            if(x.kind!=="IGNORE"||x.reason!=="PROMO_INFO") fail("promo-info",JSON.stringify(x));
            x=parseObservedMessage("ЗАПРОС: выгодно вложить в недвижимость 5-6 млн с моими %. Участок, дом, квартира, коммерция. Нужны ликвидные интересные объекты на срочной продаже. Присылайте ваши эксы.");
            if(x.kind!=="IGNORE"||x.reason!=="BROAD_INVESTOR_REQUEST") fail("broad-investor",JSON.stringify(x));
            x=parseObservedMessage("Кто занимается коммерцией? Нужна улица Красная, под общепит. Завтра смотрим.");
            if(x.kind!=="IGNORE"||x.reason!=="OUT_OF_SCOPE_COMMERCIAL") fail("commercial",JSON.stringify(x));
            x=parseObservedMessage("Нужен участок 6 соток, район Северный, до 4 млн.");
            if(x.kind!=="IGNORE") fail("land-only",JSON.stringify(x));
            x=parseObservedMessage("Нужен дом от застройщика. Карасунский округ. Семейная ипотека.");
            if(x.kind!=="IGNORE"||x.reason!=="DEVELOPER_HOUSE_REQUEST") fail("developer-house",JSON.stringify(x));
            x=parseObservedMessage("Нужен готовый дом. Карасунский округ. До 9 млн. Семейная ипотека.");
            if(x.kind!=="REQUEST"||!x.types.includes("house")) fail("ready-house",JSON.stringify(x));
            x=parseObservedMessage("Запрос. 2к квартира, ФМР, до 8 млн, наличные.");
            if(x.kind!=="REQUEST"||!x.types.includes("2k")) fail("apartment",JSON.stringify(x));
            return "MVP_SCOPE_FILTER_PASS";
          }

          // ============================================================
          // LIVE OBJECT SOURCE + MATCH DRY v1.4
          // ============================================================
          function toMsTimestamp(t) {
            const n = Number(t || 0);
            if (!Number.isFinite(n) || n <= 0) return 0;
            return n < 10_000_000_000 ? n * 1000 : n;
          }

          function extractExplicitJks(text) {
            const raw = String(text ?? "");
            const out = [];
            for (const m of raw.matchAll(/жк\s+([а-яёa-z0-9][^,\n;:()]{1,60})/giu)) {
              let name = normalizeText(m[1]).trim();
              if (name.length >= 2) out.push(name);
            }
            return [...new Set(out)];
          }

          function parseObjectPrice(text) {
            const raw = String(text ?? "").replace(/\u00A0|\u202F/g, " ");
            const vals = [];
            for (const m of raw.matchAll(/(\d{1,3}(?:\s\d{3}){1,2})\s*(?:₽|руб(?:лей|ля|\.)?)/giu)) {
              const v = Number(m[1].replace(/\s/g, ""));
              if (v >= 500_000 && v <= 100_000_000) vals.push(v);
            }
            for (const m of raw.matchAll(/(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?)/giu)) {
              const v = moneyTokenToRub(m[1], m[2]);
              if (v) vals.push(v);
            }
            return vals.length ? Math.max(...vals) : null;
          }

          function parseObjectArea(text) {
            const vals = [];
            for (const m of String(text ?? "").matchAll(/(\d+(?:[.,]\d+)?)\s*(?:м2|м²|кв\.?\s*м)/giu)) {
              const v = Number(m[1].replace(",", "."));
              if (v >= 18 && v <= 500) vals.push(v);
            }
            return vals.length ? Math.max(...vals) : null;
          }

          function parseObjectFloor(text) {
            const raw = String(text ?? "");
            const m = raw.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*(?:этаж|эт)?/iu);
            return m ? {floor:Number(m[1]), total:Number(m[2])} : {floor:null,total:null};
          }

          function parseObjectMessage(m) {
            const raw = messageText(m).trim();
            if (!raw) return null;
            const types = parseRequestTypes(raw);
            const price = parseObjectPrice(raw);
            if (!types.length || price === null) return null;
            const fl = parseObjectFloor(raw);
            const pcho = /(?:пчо|предчист)/iu.test(raw);
            return {
              objectId: messageId(m) || `obj:${messageTime(m)}:${raw.slice(0,50)}`,
              time: iso(messageTime(m)),
              sourceText: raw,
              norm: normalizeText(raw),
              profile:{address:raw.split(/\n+/).slice(0,3).join(" | ").slice(0,300)},
              types,
              price,
              area: parseObjectArea(raw),
              land: parseLandConstraint(raw).min,
              floor: fl.floor,
              totalFloors: fl.total,
              explicitJks: extractExplicitJks(raw),
              geo: detectGeoTerms(raw),
              routeCorpus: normalizeText(raw),
              repair: /ремонт/iu.test(raw) && !pcho && !/без\s+ремонт|чернов/iu.test(raw),
              freshRepair: /(?:современн|свеж|нов|евро|дизайнерск)[^\n]{0,25}ремонт|ремонт[^\n]{0,25}(?:современн|свеж|нов|евро|дизайнерск)/iu.test(raw),
              pcho,
              furniture:/мебел/iu.test(raw),
              appliances:/техник/iu.test(raw),
              gas:/(?:^|[^а-яa-z])газ(?:[^а-яa-z]|$)|газифиц/iu.test(raw),
              courtyardWindows:/окн[^\n]{0,20}во\s+двор/iu.test(raw),
              centralHeating:/центральн[^\n]{0,12}отоплен/iu.test(raw),
              offMarket:/без\s+авито|не\s+в\s+реклам|нет\s+в\s+реклам/iu.test(raw),
              directChain:true,
            };
          }

          function requestGeoMatchesObject(req,obj) {
            if (!req.geo?.length || req.geo.includes("весь краснодар")) return true;
            const corpus = `${obj.norm} ${obj.routeCorpus}`;
            return req.geo.some(g => {
              if (g.startsWith("улица:")) return corpus.includes(normalizeText(g.slice(6)));
              return (GEO_ALIASES[g] || [g]).some(a => corpus.includes(normalizeText(a)));
            });
          }

          function requestJkMatchesObject(req,obj) {
            const explicitReq = extractExplicitJks(req.raw || "");
            if (explicitReq.length) {
              return explicitReq.some(r => obj.explicitJks.some(o => o === r || o.includes(r) || r.includes(o)));
            }
            if (!req.knownJks?.length) return true;
            return req.knownJks.some(jk => (REQUEST_JK_ALIASES[jk] || [jk]).some(a => obj.norm.includes(normalizeText(a))));
          }

          function matchRequestToLiveObject(req,obj) {
            const reasons = [];
            const fail = reason => ({match:false,reason,reasons});
            if (req.types?.length && !req.types.some(t => obj.types.includes(t) || (t==="ground-format" && obj.types.includes("house")))) return fail("TYPE_MISS");
            reasons.push("TYPE");
            if (!requestJkMatchesObject(req,obj)) return fail("JK_MISS");
            if (extractExplicitJks(req.raw||"").length || req.knownJks?.length) reasons.push("JK");
            if (!requestGeoMatchesObject(req,obj)) return fail("GEO_MISS");
            if (req.geo?.length) reasons.push("GEO");

            let budget = req.budgetMax;
            const tb = obj.types.map(t => req.typeBudgets?.[t]).filter(Number.isFinite);
            if (tb.length) budget = Math.max(...tb);
            if (budget != null && req.commission?.inside && req.commission?.amount) budget -= req.commission.amount;
            if (budget != null && obj.price > budget) return fail("PRICE_MISS");
            if (budget != null) reasons.push("PRICE");

            if (req.area?.min != null && (obj.area == null || obj.area < req.area.min)) return fail("AREA_MIN_MISS");
            if (req.area?.max != null && (obj.area == null || obj.area > req.area.max)) return fail("AREA_MAX_MISS");
            if (req.floor?.min != null && (obj.floor == null || obj.floor < req.floor.min)) return fail("FLOOR_MIN_MISS");
            if (req.floor?.max != null && (obj.floor == null || obj.floor > req.floor.max)) return fail("FLOOR_MAX_MISS");
            if (req.floor?.excludeFirst && obj.floor === 1) return fail("FIRST_FLOOR_EXCLUDED");
            if (req.floor?.excludeLast && obj.floor != null && obj.totalFloors != null && obj.floor === obj.totalFloors) return fail("LAST_FLOOR_EXCLUDED");

            const c = req.conditions || {};
            if (c.pchoRequired && !obj.pcho) return fail("PCHO_REQUIRED");
            if (c.pchoExcluded && obj.pcho) return fail("PCHO_EXCLUDED");
            if (c.repairRequired && !obj.repair) return fail("REPAIR_REQUIRED");
            if (c.goodRepair && !obj.repair) return fail("GOOD_REPAIR_REQUIRED");
            if (c.freshRepair && !obj.freshRepair) return fail("FRESH_REPAIR_REQUIRED");
            if (c.furnitureRequired && !obj.furniture) return fail("FURNITURE_REQUIRED");
            if (c.appliancesRequired && !obj.appliances) return fail("APPLIANCES_REQUIRED");
            if (c.gasRequired && !obj.gas) return fail("GAS_REQUIRED");
            if (c.courtyardWindows && !obj.courtyardWindows) return fail("COURTYARD_WINDOWS_REQUIRED");
            if (c.centralHeating && !obj.centralHeating) return fail("CENTRAL_HEATING_REQUIRED");
            if (req.noAdvertising && !obj.offMarket) return fail("OFF_MARKET_UNCONFIRMED");
            return {match:true,reason:"MATCH",reasons};
          }

          function objectMatchSelfTest() {
            const fail=(n,d='')=>{throw new Error(`OBJECT MATCH SELFTEST ${n}${d?': '+d:''}`)};
            const obj=parseObjectMessage({id:"o1",timestamp:Date.now(),text:"🏠 ЖК Дарград, Новая Адыгея, Тургеневское шоссе\n🔹 Евро-2\n🔹 33 м²\n🔹 4/5 этаж\n🔹 Современный ремонт / мебель / техника\n💰 4 450 000 ₽"});
            if(!obj || obj.price!==4450000 || !obj.types.includes("euro2") || obj.area!==33 || obj.floor!==4 || obj.totalFloors!==5) fail("parse",JSON.stringify(obj));
            const good=parseObservedMessage("Запрос. Евро-2 ЖК Дарград. До 4,6 млн. Не выше 5 этажа.");
            if(good.kind!=="REQUEST" || !matchRequestToLiveObject(good,obj).match) fail("positive");
            const bad=parseObservedMessage("Запрос. 2к ЖК Лучший, Ростовское шоссе. ПЧО. Не выше 9 этажа.");
            if(matchRequestToLiveObject(bad,obj).match) fail("negative");
            return "OBJECT_MATCH_DRY_PASS";
          }

          async function discoverChatByExactTitle(client,title) {
            const wanted=normalizeText(title);
            let rows=[];
            try {
              const got=await client.getChats(200,0);
              if(Array.isArray(got)) rows=got;
              else if(Array.isArray(got?.chats)) rows=got.chats;
              else if(Array.isArray(got?.payload?.chats)) rows=got.payload.chats;
            } catch {}
            if(!rows.length && Array.isArray(client?.lastSyncPayload?.chats)) rows=client.lastSyncPayload.chats;
            return rows.find(c=>normalizeText(c?.title||c?.name||"")===wanted) || null;
          }


