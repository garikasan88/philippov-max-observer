                if (got.indices.length < 50) got.indices.push(row.index);
                const t = iso(row.rawTime);
                if (!got.firstTime) got.firstTime = t;
                got.lastTime = t;
                got.textLens.add(row.textLen);
                objectRawShapeGroups.set(key, got);
              }

              const objectRawShapeSummary = [...objectRawShapeGroups.values()].map(g => ({
                count: g.count,
                indices: g.indices,
                firstTime: g.firstTime,
                lastTime: g.lastTime,
