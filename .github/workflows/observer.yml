              // Only schema paths, primitive types, string lengths, array lengths,
              // and object key counts are logged. Suspicious/dynamic object keys are redacted.
              // Target window covers the fresh 38-message burst seen at ~14:09 MSK.
              function safePathKey(key) {
                const s = String(key || '');
                return /^[A-Za-z_][A-Za-z0-9_]{0,63}$/.test(s) ? s : '<dynamic-key>';
              }

              function rawShape(value, path = 'rawData', depth = 0, out = [], seen = new WeakSet()) {
                if (out.length >= 220) return out;

                if (value === null) {
                  out.push(`${path}:null`);
                  return out;
                }

                const t = typeof value;

                if (t === 'string') {
                  out.push(`${path}:string(len=${value.length})`);
                  return out;
                }

                if (t === 'number' || t === 'boolean' || t === 'bigint') {
                  out.push(`${path}:${t}`);
                  return out;
                }

                if (t !== 'object') {
                  if (t !== 'undefined' && t !== 'function') out.push(`${path}:${t}`);
                  return out;
                }

                if (depth >= 9) {
                  out.push(`${path}:object(depth-limit)`);
                  return out;
                }

                if (seen.has(value)) {
                  out.push(`${path}:circular`);
                  return out;
                }
                seen.add(value);

                if (Array.isArray(value)) {
                  out.push(`${path}:array(len=${value.length})`);
                  for (let i = 0; i < Math.min(value.length, 16) && out.length < 220; i++) {
                    rawShape(value[i], `${path}[${i}]`, depth + 1, out, seen);
                  }
                  return out;
                }

                const keys = Object.keys(value).sort();
                out.push(`${path}:object(keys=${keys.length})`);
                for (const key of keys) {
                  if (out.length >= 220) break;
                  rawShape(value[key], `${path}.${safePathKey(key)}`, depth + 1, out, seen);
                }
                return out;
              }

              const objectRawWindowStartMs = Date.parse('2026-09-05T11:09:00.000Z');
              const objectRawWindowEndMs = Date.parse('2026-09-05T11:09:20.000Z');

              const objectRawTargetRows = objectHistory
                .map((m, index) => ({
