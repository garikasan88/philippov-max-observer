                }, {});
                console.log(`REQUEST PARSER BATCH: ${JSON.stringify(parserCounts)}`);


              // Safe learning telemetry: only kind/reason counters, never RAW MAX text.
              const reasonCounts = rows.reduce((acc, row) => {
                const key = `${row?.parsed?.kind || 'UNKNOWN'}:${row?.parsed?.reason || 'NO_REASON'}`;
                acc[key] = (acc[key] || 0) + 1;
                return acc;
              }, {});
              console.log(`REQUEST PARSER REASONS: ${JSON.stringify(reasonCounts)}`);

                // Repository is public: never publish RAW MAX text in plaintext.
                // Persist the whole batch encrypted with the MAX_SESSION-derived AES-256-GCM key.
                const encryptedFeed = encryptSession(rows, BOOTSTRAP_RAW);
                await gh(`/issues/${feedIssue.number}/comments`, {
                  method: 'POST',
                  body: {
                    body: [
                      `@${GH_OWNER}`,
