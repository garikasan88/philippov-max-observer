name: PHILIPPOV MAX OBSERVER — DISPATCH BRIDGE

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - 'src/request_match_v2_patch.js'
      - 'src/request_match_v2_hotfix.js'
      - 'src/request_match_v21_real_requests_hotfix.js'
      - 'src/request_match_v21_regex_fix.js'
      - 'src/request_match_v21_production_overlay.py'
      - '.github/workflows/observer.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: philippov-max-observer-dispatch-bridge
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch production sensor
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Dispatch PHILIPPOV production sensor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/max_observer_production.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME:-main}"
          echo "PRODUCTION SENSOR DISPATCH: PASS"
