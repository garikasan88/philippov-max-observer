name: PHILIPPOV MAX OBSERVER — WORKING ONE-SHOT

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: philippov-max-observer-v2-final
  cancel-in-progress: true

jobs:
  observe:
    name: Observer read-only
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      MAX_BOOTSTRAP_SECRET: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: MAX Observer V2 FINAL
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          npm init -y >/dev/null 2>&1
          npm install --silent --ignore-scripts --omit=optional --no-audit --no-fund webmaxsocket@1.2.7

          cat > observer.cjs <<'JS'
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { WebMaxClient } = require('webmaxsocket');

          // ------------------------------------------------------------
          // PHILIPPOV MAX OBSERVER V2 FINAL + LIVE OBJECT MATCH DRY v1.4
          // Read-only. No send/reply/edit/delete methods are called.
          // One target account + one confirmed test chat.
          // ------------------------------------------------------------

          const EXPECTED_USER_ID = '402668979';
          const TARGET_CHAT_ID = '-78471339098233';
          const TARGET_CHAT_NAME_FALLBACK = 'СКАУТ ТЕСТ';
          const OBJECT_CHAT_TITLE = 'Мои объекты';
          const REQUEST_LOOKBACK_MS = 24 * 60 * 60 * 1000;

          const STATE_TITLE = '[STATE] PHILIPPOV MAX OBSERVER V2 FINAL';
          const FEED_TITLE = 'PHILIPPOV MAX OBSERVER — REQUEST FEED';
          const BLOCKER_TITLE = 'PHILIPPOV MAX OBSERVER — BLOCKER';
          const MATCH_FEED_TITLE = 'PHILIPPOV MAX OBSERVER — MATCH DRY FEED';
          const SESSION_NAME = 'philippov_max_observer_v2_final';
          const SESSION_FILE = path.join(process.cwd(), 'sessions', `${SESSION_NAME}.json`);

          const GH_TOKEN = String(process.env.GH_TOKEN || '');
          const GH_REPO = String(process.env.GH_REPO || '');
          const GH_OWNER = String(process.env.GH_OWNER || 'garikasan88');
          const GH_RUN_URL = String(process.env.GH_RUN_URL || '');
          const BOOTSTRAP_RAW = String(process.env.MAX_BOOTSTRAP_SECRET || '').trim();

          const HISTORY_BACKWARD = 500;
          const MAX_SEEN_IDS = 3000;

          if (!GH_TOKEN || !GH_REPO) throw new Error('GITHUB_CONTEXT_MISSING');
          if (!BOOTSTRAP_RAW) throw new Error('MAX_SESSION_EMPTY');

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          function bootstrapToken(raw) {
            const s = String(raw || '').trim();
            if (!s) return '';
            try {
              const x = JSON.parse(s);
              if (typeof x === 'string') return x.trim();
              for (const k of ['token', 'access_token', 'accessToken', 'auth_token', 'authToken']) {
                if (typeof x?.[k] === 'string' && x[k].trim()) return x[k].trim();
              }
            } catch {}
            return s;
          }

          const BOOTSTRAP_TOKEN = bootstrapToken(BOOTSTRAP_RAW);
          if (!BOOTSTRAP_TOKEN) throw new Error('MAX_SESSION_TOKEN_EMPTY');

          const API = `https://api.github.com/repos/${GH_REPO}`;

          async function gh(urlPath, { method = 'GET', body = null } = {}) {
            let last = null;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const res = await fetch(`${API}${urlPath}`, {
                  method,
                  headers: {
                    Authorization: `Bearer ${GH_TOKEN}`,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    'Content-Type': 'application/json',
                    'User-Agent': 'PHILIPPOV-MAX-OBSERVER-V2-FINAL',
                  },
                  body: body == null ? undefined : JSON.stringify(body),
                });
                const text = await res.text();
                let data = null;
                try { data = text ? JSON.parse(text) : null; } catch { data = text; }
                if (!res.ok) throw new Error(`GitHub API ${method} ${urlPath}: HTTP ${res.status}`);
                return data;
              } catch (e) {
                last = e;
                if (attempt < 3) await sleep(attempt * 750);
              }
            }
            throw last;
          }

          async function findIssueByTitle(title) {
            for (let page = 1; page <= 5; page++) {
              const rows = await gh(`/issues?state=all&per_page=100&page=${page}`);
              const hit = rows.find(x => !x.pull_request && x.title === title);
              if (hit) return hit;
              if (rows.length < 100) break;
            }
            return null;
          }

          function parseCursor(body) {
            const m = String(body || '').match(/<!--PHILIPPOV_CURSOR_V2_FINAL\n([\s\S]*?)\nPHILIPPOV_CURSOR_V2_FINAL-->/);
            if (!m) return { version: 2, chats: {} };
            try {
              const x = JSON.parse(m[1]);
              if (!x || typeof x !== 'object') return { version: 2, chats: {} };
              if (!x.chats || typeof x.chats !== 'object') x.chats = {};
              return x;
            } catch {
              return { version: 2, chats: {} };
            }
          }

          function parseEncryptedSession(body) {
            const m = String(body || '').match(/<!--PHILIPPOV_SESSION_ENC_V2_FINAL\n([\s\S]*?)\nPHILIPPOV_SESSION_ENC_V2_FINAL-->/);
            if (!m) return null;
            try { return JSON.parse(m[1]); } catch { return null; }
          }

          function encryptionKey(secret) {
            return crypto
              .createHash('sha256')
              .update(`PHILIPPOV_MAX_OBSERVER_V2_FINAL\0${secret}`)
              .digest();
          }

          function keyId(secret) {
            return crypto
              .createHash('sha256')
              .update(`PHILIPPOV_MAX_OBSERVER_V2_FINAL_ID\0${secret}`)
              .digest('hex')
              .slice(0, 16);
          }

          function encryptSession(session, secret) {
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', encryptionKey(secret), iv);
            const cipherText = Buffer.concat([
              cipher.update(Buffer.from(JSON.stringify(session), 'utf8')),
              cipher.final(),
            ]);
            return {
              v: 1,
              keyId: keyId(secret),
              iv: iv.toString('base64'),
              tag: cipher.getAuthTag().toString('base64'),
              data: cipherText.toString('base64'),
            };
          }

          function decryptSession(envelope, secret) {
            if (!envelope || envelope.v !== 1 || envelope.keyId !== keyId(secret)) return null;
            try {
              const decipher = crypto.createDecipheriv(
                'aes-256-gcm',
                encryptionKey(secret),
                Buffer.from(envelope.iv, 'base64'),
              );
              decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
              const plain = Buffer.concat([
                decipher.update(Buffer.from(envelope.data, 'base64')),
                decipher.final(),
              ]).toString('utf8');
              return JSON.parse(plain);
            } catch {
              return null;
            }
          }

          function stateBody(cursor, encryptedSession) {
            return [
              'PHILIPPOV MAX OBSERVER V2 FINAL — service state.',
              'MAX session below is AES-256-GCM encrypted.',
              '',
              '<!--PHILIPPOV_CURSOR_V2_FINAL',
              JSON.stringify(cursor),
              'PHILIPPOV_CURSOR_V2_FINAL-->',
              '',
              '<!--PHILIPPOV_SESSION_ENC_V2_FINAL',
              encryptedSession ? JSON.stringify(encryptedSession) : 'null',
              'PHILIPPOV_SESSION_ENC_V2_FINAL-->',
            ].join('\n');
          }

          function messageId(m) {
            return String(m?.id ?? m?.rawData?.id ?? m?.messageId ?? '').trim();
          }

          function messageTime(m) {
            const n = Number(m?.timestamp ?? m?.rawData?.time ?? m?.time ?? 0);
            return Number.isFinite(n) && n > 0 ? n : 0;
          }

          function textFromValue(value, depth = 0) {
            if (typeof value === 'string') return value;
            if (!value || typeof value !== 'object' || depth > 4) return '';

            for (const key of ['text', 'message', 'caption', 'body', 'content']) {
              const nested = value[key];

              if (typeof nested === 'string' && nested.trim()) {
                return nested;
              }

              if (nested && typeof nested === 'object') {
                const found = textFromValue(nested, depth + 1);
                if (found) return found;
              }
            }

            return '';
          }

          function messageText(m) {
            return (
              textFromValue(m?.text) ||
              textFromValue(m?.rawData?.text) ||
              textFromValue(m?.rawData?.message)
            );
          }

          function senderId(m) {
            const raw = m?.rawData?.sender;
            const value =
              m?.senderId ??
              (raw && typeof raw === 'object' ? raw.id : raw) ??
              m?.rawData?.senderId ??
              m?.rawData?.sender_id ??
              'UNKNOWN';
            return String(value);
          }

          function senderName(m) {
            try {
              if (typeof m?.getSenderName === 'function') {
                const n = String(m.getSenderName() || '').trim();
                if (n && n !== 'Unknown') return n;
              }
            } catch {}
            const raw = m?.rawData?.sender;
            if (raw && typeof raw === 'object') {
              const n = raw.fullname || raw.full_name || raw.name ||
                [raw.first_name, raw.last_name].filter(Boolean).join(' ');
              if (n) return String(n);
            }
            return 'UNKNOWN';
          }

          function compactSeen(ids) {
            return [...new Set((Array.isArray(ids) ? ids : []).map(String).filter(Boolean))]
              .slice(-MAX_SEEN_IDS);
          }

          function iso(t) {
            const n = Number(t || 0);
            if (!n) return 'UNKNOWN';
            try {
              return new Date(n < 10_000_000_000 ? n * 1000 : n).toISOString();
            } catch {
              return 'UNKNOWN';
            }
          }

          async function ensureIssue(title, body) {
            let issue = await findIssueByTitle(title);
            if (!issue) {
              issue = await gh('/issues', { method: 'POST', body: { title, body } });
            }
            return issue;
          }

          async function saveState(issueNumber, cursor, session) {
            const encrypted = session ? encryptSession(session, BOOTSTRAP_RAW) : null;
            await gh(`/issues/${issueNumber}`, {
              method: 'PATCH',
              body: { body: stateBody(cursor, encrypted), state: 'closed' },
            });
          }

          async function blocker(error) {
            const text = String(error?.message || error || 'UNKNOWN').slice(0, 1200);
            const body = [
              `@${GH_OWNER}`,
              '',
              'PHILIPPOV MAX OBSERVER V2 FINAL — BLOCKER',
              `Ошибка: ${text}`,
              `Запуск: ${GH_RUN_URL}`,
              '',
              'Fisherman / рассылка не изменялись.',
            ].join('\n');
            let issue = await findIssueByTitle(BLOCKER_TITLE);
            if (!issue) {
              issue = await gh('/issues', { method: 'POST', body: { title: BLOCKER_TITLE, body } });
            } else {
              await gh(`/issues/${issue.number}`, { method: 'PATCH', body: { body, state: 'open' } });
            }
          }

          async function closeBlocker() {
            const issue = await findIssueByTitle(BLOCKER_TITLE);
            if (issue?.state === 'open') {
              await gh(`/issues/${issue.number}`, { method: 'PATCH', body: { state: 'closed' } });
            }
          }

          // ============================================================
          // REQUEST PARSER v1.0 — port of CLOSED 61-case REQUEST/MATCH ruleset
          // DRY ONLY: parse/classify; does not send anything to MAX.
          // ============================================================
          // PHILIPPOV SCOUT REQUEST PARSER v1.0
          // Ported without semantic redesign from CURRENT_REQUEST_MATCH_DRY_V06 (01.09.2026).
          // Training basis: 61 manually reviewed REQUEST→MATCH cases. UNKNOWN stays UNKNOWN.
          
          function normalizeText(text) {
            return String(text ?? "")
              .toLowerCase()
              .replaceAll("ё", "е")
              .replaceAll("²", "2")
              .replace(/[^0-9a-zа-я]+/giu, " ")
              .replace(/\s+/g, " ")
              .trim();
          }
          
          function containsAny(norm, needles) {
            return needles.some(x => norm.includes(normalizeText(x)));
          }
          
          function firstNumber(s) {
            const m = String(s ?? "").match(/\d+(?:[.,]\d+)?/u);
            return m ? Number(m[0].replace(",", ".")) : null;
          }
          
          function moneyTokenToRub(rawNum, rawUnit = "") {
            const src = String(rawNum).trim();
            const grouped = /^\d{1,3}(?:[ \u00A0\u202F]\d{3}){1,2}$/.test(src);
            const compact = grouped ? src.replace(/[^\d]/g, "") : src.replace(",", ".");
            const n = Number(compact);
            if (!Number.isFinite(n) || n <= 0) return null;
            const u = normalizeText(rawUnit);
            if (/млн|милл|миллион/u.test(u)) return Math.round(n * 1_000_000);
            if (/тыс|тр/u.test(u)) return Math.round(n * 1_000);
            if (/руб/u.test(u)) return Math.round(n);
            if (grouped && n >= 100000) return Math.round(n);
            if (grouped && n >= 1000 && n < 100000) return Math.round(n * 1_000);
            if (n >= 1000 && n <= 100000) return Math.round(n * 1_000);
            if (n >= 1 && n < 100) return Math.round(n * 1_000_000);
            if (n >= 100000 && n <= 100000000) return Math.round(n);
            return null;
          }
          
          function parseBudgetMax(text) {
            const raw = String(text ?? "").replace(/(\d)\.(\d{3})(?!\d)/g, "$1 $2");
            const candidates = [];
            const add = (num, unit, why) => {
              const v = moneyTokenToRub(num, unit);
              if (v !== null && v >= 500_000 && v <= 100_000_000) candidates.push({value:v, why});
            };
            const N = "(\\d{1,3}(?:[ \\u00A0\\u202F]\\d{3}){1,2}|\\d+(?:[.,]\\d+)?)";
            const U = "(млн|миллион(?:а|ов)?|тыс(?:яч)?|тр\\.?|т\\.?\\s*р\\.?|руб(?:лей|ля|\\.)?)?";
          
            // Explicit budget wording may legally carry a plain 4-digit "thousands" value.
            for (const m of raw.matchAll(new RegExp(`бюджет(?:\\s*(?:до|макс(?:имум)?))?[^\\d\\n]{0,18}${N}\\s*${U}`, "giu"))) add(m[1], m[2] || "", "budget-explicit");
            for (const m of raw.matchAll(new RegExp(`(?:до|макс(?:имум)?)[^\\d\\n]{0,8}${N}\\s*(млн|миллион(?:а|ов)?|тыс(?:яч)?|тр\\.?|т\\.?\\s*р\\.?|руб(?:лей|ля|\\.)?)`, "giu"))) add(m[1], m[2], "money-unit");
            // "до 6500" / "до 5 700" without unit is common realtor shorthand; require thousands-like shape so "до 20 лет" is never money.
            for (const m of raw.matchAll(/(?:до|макс(?:имум)?)[^\d\n]{0,8}(\d{4,5}|\d{1,2}[ \u00A0\u202F]\d{3})(?!\s*(?:лет|этаж|м2|м²|кв))/giu)) add(m[1], "", "shorthand-thousands");
            for (const m of raw.matchAll(/(\d{3,5})\s*(?:тыс(?:яч)?|тр\.?)?\s*(?:нал|налич)/giu)) add(m[1], "тыс", "cash-adjacent");
            for (const m of raw.matchAll(/(?:нал|налич(?:ка|ные|ными)?)[^\d\n]{0,8}(\d{3,5}|\d{1,2}[ \u00A0\u202F]\d{3})(?!\s*(?:лет|этаж|м2|м²|кв))/giu)) add(m[1], "", "cash-following");
            for (const m of raw.matchAll(/(\d{3,5})\s*[-–—]\s*(\d{3,5})(?:\s*(?:тыс|тр))?/giu)) add(m[2], "тыс", "range-thousands");
            for (const m of raw.matchAll(/(\d+(?:[.,]\d+)?)\s*[-–—]\s*(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?)/giu)) add(m[2], m[3], "range-millions");
            // Common realtor shorthand without the word "budget": "6,2 млн" or object mention "за 3500".
            for (const m of raw.matchAll(/(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?)/giu)) add(m[1], m[2], "generic-millions");
            for (const m of raw.matchAll(/\bза\s+(\d{4,5})(?!\s*(?:лет|этаж|м2|м²|кв))/giu)) add(m[1], "", "price-after-za");
          
            if (!candidates.length) return null;
            return candidates.sort((a,b) => b.value - a.value)[0].value;
          }
          
          function parseConditionalFinanceBudgets(text) {
            const raw = String(text ?? "").replace(/(\d)\.(\d{3})(?!\d)/g, "$1,$2");
            const get = (re) => {
              const m = raw.match(re);
              return m ? moneyTokenToRub(m[1], m[2] || "") : null;
            };
            const familyMortgageMax = get(/если\s+семейн(?:ая|ой)?\s+ипотек[^\d\n]{0,25}(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)?/iu);
            const cashMax = get(/если\s+налич(?:ные|ка|ными)?[^\d\n]{0,25}(?:до\s*)?(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)?/iu);
            return {familyMortgageMax, cashMax};
          }
          
          function parseTypeSpecificBudgets(text) {
            const raw = String(text ?? "").replace(/(\d)\.(\d{3})(?!\d)/g, "$1,$2");
            const out = {studio:null, "1k":null, euro2:null, "2k":null, "3k":null, house:null};
            const take = (reRange, reOne, key) => {
              const mr = raw.match(reRange);
              if (mr) { out[key] = moneyTokenToRub(mr[2], mr[3] || ""); return; }
              const mo = raw.match(reOne);
              if (mo) out[key] = moneyTokenToRub(mo[1], mo[2] || "");
            };
            take(/(?:однушк[а-я]*|1\s*[- ]?(?:к|ком)[а-я]*)[^\n\d]{0,24}(\d+(?:[.,]\d+)?)\s*[-–—]\s*(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)/iu,
                 /(?:однушк[а-я]*|1\s*[- ]?(?:к|ком)[а-я]*)[^\n\d]{0,24}(?:до\s*)?(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)/iu, "1k");
            take(/(?:двушк[а-я]*|2\s*[- ]?(?:к|ком)[а-я]*)[^\n\d]{0,24}(\d+(?:[.,]\d+)?)\s*[-–—]\s*(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)/iu,
                 /(?:двушк[а-я]*|2\s*[- ]?(?:к|ком)[а-я]*)[^\n\d]{0,24}(?:до\s*)?(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)/iu, "2k");
            take(/(?:тр[её]шк[а-я]*|3\s*[- ]?(?:к|ком)[а-я]*)[^\n\d]{0,24}(\d+(?:[.,]\d+)?)\s*[-–—]\s*(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)/iu,
                 /(?:тр[её]шк[а-я]*|3\s*[- ]?(?:к|ком)[а-я]*)[^\n\d]{0,24}(?:до\s*)?(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)/iu, "3k");
            take(/студи[а-я]*[^\n\d]{0,24}(\d+(?:[.,]\d+)?)\s*[-–—]\s*(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)/iu,
                 /студи[а-я]*[^\n\d]{0,24}(?:до\s*)?(\d+(?:[.,]\d+)?)\s*(млн|миллион(?:а|ов)?|тыс|тр)/iu, "studio");
            return out;
          }
          
          function parseCommissionInside(text) {
            const raw = String(text ?? "").replace(/(\d)\.(\d{3})(?!\d)/g, "$1 $2");
            const norm = normalizeText(raw);
            const inside = /(?:мои|моими|наши|нашими|комисс)[^\n]{0,30}(?:внутри|в цене)|(?:внутри)[^\n]{0,30}(?:мои|наши|комисс)/iu.test(raw) || /с\s+(?:моими|нашими)/iu.test(raw);
            const above = /(?:мои|наши|комисс)[^\n]{0,30}(?:сверху)|(?:сверху)[^\n]{0,30}(?:мои|наши|комисс)/iu.test(raw);
            const parseCommissionNum = (num, unit="") => {
              let v = moneyTokenToRub(num, unit);
              if (v === null) {
                const n = Number(String(num).replace(/[^\d.,]/g, "").replace(",", "."));
                if (Number.isFinite(n) && n >= 20 && n <= 999) v = Math.round(n * 1000);
              }
              return v;
            };
            let amount = null;
            // For "150-200" reserve the upper end so the buyer budget is never overstated.
            const range = raw.match(/(?:мои|моими|наши|нашими|комисс(?:ия|ии|ию)?)[^\d\n]{0,15}(\d{2,4})\s*[-–—]\s*(\d{2,4})/iu) || raw.match(/(\d{2,4})\s*[-–—]\s*(\d{2,4})[^\n]{0,15}(?:мои|наши|комисс)/iu);
            if (range) amount = parseCommissionNum(range[2], "");
            if (amount === null) {
              for (const m of raw.matchAll(/(?:мои|моими|наши|нашими|комисс(?:ия|ии|ию)?)[^\d\n]{0,20}(\d{1,3}(?:[ \u00A0\u202F]\d{3})?|\d+(?:[.,]\d+)?)\s*(тыс|тр|млн)?/giu)) {
                const v = parseCommissionNum(m[1], m[2] || "");
                if (v !== null && v >= 20_000 && v <= 2_000_000) { amount = v; break; }
              }
            }
            if (amount === null) {
              for (const m of raw.matchAll(/(\d{1,3}(?:[ \u00A0\u202F]\d{3})?|\d+(?:[.,]\d+)?)\s*(тыс|тр)?[^\n]{0,12}(?:мои|наши|комисс)/giu)) {
                const v = parseCommissionNum(m[1], m[2] || "");
                if (v !== null && v >= 20_000 && v <= 2_000_000) { amount = v; break; }
              }
            }
            const percent = (() => {
              const m = raw.match(/(?:мои|моими|наши|нашими|комисс(?:ия|ии|ию)?)[^\d%\n]{0,15}(\d+(?:[.,]\d+)?)\s*%/iu) || raw.match(/(\d+(?:[.,]\d+)?)\s*%[^\n]{0,12}(?:мои|наши|комисс)/iu);
              return m ? Number(m[1].replace(",", ".")) : null;
            })();
            const clientPays = /клиент\s+платит|покупатель\s+(?:сам\s+)?(?:платит|оплачивает)/iu.test(raw);
            return {inside, above, amount, percent, clientPays, hidden: clientPays && amount === null && percent === null, rawHint: norm.includes("с нашими") || norm.includes("с моими")};
          }
          
          
          const REQUEST_JK_ALIASES = Object.freeze({
            "смородина": ["смородина"],
            "перспектива": ["перспектива"],
            "альфа": ["альфа", "кино"],
            "кино": ["альфа", "кино"],
            "панорама": ["панорама"],
            "дом у озера": ["дом у озера", "дом озера"],
