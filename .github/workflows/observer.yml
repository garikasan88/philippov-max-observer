                rejectedTotal: objectDiagRows.filter(r => !r.accepted).length,
                reasonCounts: objectDiagReasonCounts,
                within24hTotal: objectDiag24h.length,
                within24hAccepted: objectDiag24h.filter(r => r.accepted).length,
                within24hRejected: objectDiag24h.filter(r => !r.accepted).length,
