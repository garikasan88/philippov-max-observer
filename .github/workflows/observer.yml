              const seen = new Set(compactSeen(chatState.seenIds));
              const lastTime = Number(chatState.lastTime || 0);
              const nextSeen = [...seen];
              const rows = [];
              let maxTime = lastTime;

              for (const m of ordered) {
                const id = messageId(m) ||
                  `t:${messageTime(m)}:${senderId(m)}:${messageText(m).slice(0, 80)}`;
                const t = messageTime(m);

                maxTime = Math.max(maxTime, t);
                if (seen.has(id)) continue;

                // BOUNDARY SAFE v1.1:
                // seenIds is the authoritative deduplication mechanism.
                // Never drop an unseen message only because MAX returned a timestamp
                // older than the previous cursor. This closes the exact-run-boundary
                // race where a message appears while the scheduled check is running.
                nextSeen.push(id);
                if (senderId(m) === EXPECTED_USER_ID) continue;

                rows.push({
                  group,
                  chatId: cid,
                  sender: senderName(m),
                  senderId: senderId(m),
                  messageId: id,
                  time: iso(t),
                  raw: messageText(m),
                  parsed: parseObservedMessage(messageText(m)),
                });
