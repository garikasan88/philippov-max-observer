name: PHILIPPOV MAX OBSERVER — PRODUCTION SENSOR

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Send one control notification to Igor before the production scan
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: philippov-max-observer-production-sensor
  cancel-in-progress: false

jobs:
  observer:
    name: 2 groups → parser → objects → MATCH → notify
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      MAX_BOOTSTRAP_SECRET: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_RUN_URL: ${{ github.server_url }}/${{ github.run_id }}
      PHILIPPOV_SMOKE_REQUEST: ${{ inputs.smoke }}

    steps:
      - name: Checkout frozen production sources
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run frozen production sensor logic
        shell: bash
        run: |
          set -euo pipefail

          BASE_OBSERVER="$GITHUB_WORKSPACE/src/observer_base.yml"
          BASE_PRODUCTION="$GITHUB_WORKSPACE/src/max_observer_production_base.yml"
          NEXT_ACTION_OVERLAY="$GITHUB_WORKSPACE/src/next_action_lifecycle_overlay.py"
          REQUEST_V21_OVERLAY="$GITHUB_WORKSPACE/src/request_match_v21_production_overlay.py"
          ACTIVE_OBSERVER="$GITHUB_WORKSPACE/.github/workflows/observer.yml"
          EXEC_SCRIPT="$RUNNER_TEMP/philippov_production_sensor.sh"

          test -s "$BASE_OBSERVER"
          test -s "$BASE_PRODUCTION"
          test -s "$NEXT_ACTION_OVERLAY"
          test -s "$REQUEST_V21_OVERLAY"

          # The legacy dispatcher now occupies observer.yml. Production uses the
          # frozen, last-known production source only inside this ephemeral runner.
          cp "$BASE_OBSERVER" "$ACTIVE_OBSERVER"

          python3 - "$BASE_PRODUCTION" "$EXEC_SCRIPT" "$NEXT_ACTION_OVERLAY" "$REQUEST_V21_OVERLAY" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          out = Path(sys.argv[2])
          next_overlay_path = Path(sys.argv[3])
          v21_overlay_path = Path(sys.argv[4])

          next_ns = {}
          exec(compile(next_overlay_path.read_text(encoding="utf-8"), str(next_overlay_path), "exec"), next_ns)
          apply_next = next_ns.get("apply_next_action_lifecycle_overlay")
          if not callable(apply_next):
              raise SystemExit("NEXT_ACTION_OVERLAY_FUNCTION_MISSING")
          src = apply_next(src)
          print("NEXT ACTION LIFECYCLE OVERLAY: READY")

          v21_ns = {}
          exec(compile(v21_overlay_path.read_text(encoding="utf-8"), str(v21_overlay_path), "exec"), v21_ns)
          apply_v21 = v21_ns.get("apply_request_match_v21_production_overlay")
          if not callable(apply_v21):
              raise SystemExit("V21_PRODUCTION_OVERLAY_FUNCTION_MISSING")
          src = apply_v21(src)
          print("REQUEST MATCH V2.1 PRODUCTION OVERLAY: READY")

          marker = (
              "      - name: Build production SENSOR variants\n"
              "        shell: bash\n"
              "        run: |\n"
          )
          if marker not in src:
              raise SystemExit("FROZEN_PRODUCTION_RUN_BLOCK_NOT_FOUND")

          block = src.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith("          "):
                  lines.append(line[10:])
              elif line == "":
                  lines.append("")
              else:
                  break

          script = "\n".join(lines).rstrip() + "\n"
          event_expr = "$" + "{{ github.event_name }}"
          old = f'if [[ "{event_expr}" == "workflow_dispatch" ]]; then'
          new = 'if [[ "${PHILIPPOV_SMOKE_REQUEST:-false}" == "true" ]]; then'
          if old not in script:
              raise SystemExit("FROZEN_PRODUCTION_SMOKE_MARKER_NOT_FOUND")
          script = script.replace(old, new, 1)

          out.write_text(script, encoding="utf-8")
          print("FROZEN PRODUCTION SCRIPT: READY")
          PY

          bash "$EXEC_SCRIPT"
