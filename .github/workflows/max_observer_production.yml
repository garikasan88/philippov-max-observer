name: PHILIPPOV MAX OBSERVER — PRODUCTION SENSOR

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Send one control notification to Igor before the production scan
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/max_observer_production.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: philippov-max-observer-production-sensor
  cancel-in-progress: false

jobs:
  observer:
    name: 2 groups → parser → objects → MATCH → notify
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      MAX_BOOTSTRAP_SECRET: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PHILIPPOV_SMOKE_REQUEST: ${{ inputs.smoke }}

    steps:
      - name: Checkout frozen production sources
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run frozen production sensor logic
        shell: bash
        run: |
          set -euo pipefail

          BASE_OBSERVER="$GITHUB_WORKSPACE/src/observer_base.yml"
          BASE_PRODUCTION="$GITHUB_WORKSPACE/src/max_observer_production_base.yml"
          ACTIVE_OBSERVER="$GITHUB_WORKSPACE/.github/workflows/observer.yml"
          EXEC_SCRIPT="$RUNNER_TEMP/philippov_production_sensor.sh"

          test -s "$BASE_OBSERVER"
          test -s "$BASE_PRODUCTION"

          # The legacy dispatcher now occupies observer.yml. Production uses the
          # frozen, last-known production source only inside this ephemeral runner.
          cp "$BASE_OBSERVER" "$ACTIVE_OBSERVER"

          # TEMP SAFE DIAGNOSTIC: inspect only schema paths/types/lengths of the
          # current object-message wrapper. No raw MAX text, IDs, names or prices.
          python3 - "$ACTIVE_OBSERVER" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          replacements = [
              (
                  "shape: rawShape(m?.rawData),",
                  "shape: rawShape(m, 'message'),",
              ),
              (
                  "const objectRawWindowStartMs = Date.parse('2026-09-05T11:09:00.000Z');",
                  "const objectRawWindowStartMs = Date.now() - 3 * 60 * 60 * 1000;",
              ),
              (
                  "const objectRawWindowEndMs = Date.parse('2026-09-05T11:09:20.000Z');",
                  "const objectRawWindowEndMs = Date.now() + 5 * 60 * 1000;",
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"SAFE_DIAG_MARKER_NOT_FOUND: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("CURRENT OBJECT SAFE SCHEMA DIAGNOSTIC: ENABLED")
          PY

          python3 - "$BASE_PRODUCTION" "$EXEC_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          out = Path(sys.argv[2])

          marker = (
              "      - name: Build production SENSOR variants\n"
              "        shell: bash\n"
              "        run: |\n"
          )
          if marker not in src:
              raise SystemExit("FROZEN_PRODUCTION_RUN_BLOCK_NOT_FOUND")

          block = src.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith("          "):
                  lines.append(line[10:])
              elif line == "":
                  lines.append("")
              else:
                  break

          script = "\n".join(lines).rstrip() + "\n"
          event_expr = "$" + "{{ github.event_name }}"
          old = f'if [[ "{event_expr}" == "workflow_dispatch" ]]; then'
          new = 'if [[ "${PHILIPPOV_SMOKE_REQUEST:-false}" == "true" ]]; then'
          if old not in script:
              raise SystemExit("FROZEN_PRODUCTION_SMOKE_MARKER_NOT_FOUND")
          script = script.replace(old, new, 1)

          out.write_text(script, encoding="utf-8")
          print("FROZEN PRODUCTION SCRIPT: READY")
          PY

          bash "$EXEC_SCRIPT"
