name: PHILIPPOV MAX OBSERVER — PRODUCTION SENSOR

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Send one control notification to Igor before the production scan
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/max_observer_production.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: philippov-max-observer-production-sensor
  cancel-in-progress: false

jobs:
  observer:
    name: 2 groups → parser → objects → MATCH → notify
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      MAX_BOOTSTRAP_SECRET: ${{ secrets.MAX_SESSION }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PHILIPPOV_SMOKE_REQUEST: ${{ inputs.smoke }}

    steps:
      - name: Checkout frozen production sources
        uses: actions/checkout@v4

      - name: Patch linked-object text extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/observer_base.yml')
          s = p.read_text(encoding='utf-8')
          needle = "textFromValue(m?.rawData?.text) ||"
          added = "textFromValue(m?.rawData?.link?.message?.text) ||"
          if added in s:
              print('LINKED_OBJECT_TEXT_FIX: ALREADY_PRESENT')
          else:
              if s.count(needle) != 1:
                  raise SystemExit(f'LINKED_OBJECT_TEXT_FIX_MARKER_COUNT={s.count(needle)}')
              pos = s.index(needle)
              line_start = s.rfind('\n', 0, pos) + 1
              indent = s[line_start:pos]
              replacement = needle + '\n' + indent + added
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
              print('LINKED_OBJECT_TEXT_FIX: APPLIED')
          PY

          git diff --check
          grep -F "textFromValue(m?.rawData?.link?.message?.text) ||" src/observer_base.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/observer_base.yml
          if ! git diff --cached --quiet; then
            git commit -m "Fix MAX linked-message text extraction"
            git push origin HEAD:main
          else
            echo "LINKED_OBJECT_TEXT_FIX: NO_COMMIT_NEEDED"
          fi

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run frozen production sensor logic
        shell: bash
        run: |
          set -euo pipefail

          BASE_OBSERVER="$GITHUB_WORKSPACE/src/observer_base.yml"
          BASE_PRODUCTION="$GITHUB_WORKSPACE/src/max_observer_production_base.yml"
          ACTIVE_OBSERVER="$GITHUB_WORKSPACE/.github/workflows/observer.yml"
          EXEC_SCRIPT="$RUNNER_TEMP/philippov_production_sensor.sh"

          test -s "$BASE_OBSERVER"
          test -s "$BASE_PRODUCTION"

          cp "$BASE_OBSERVER" "$ACTIVE_OBSERVER"

          python3 - "$BASE_PRODUCTION" "$EXEC_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          out = Path(sys.argv[2])

          marker = (
              "      - name: Build production SENSOR variants\n"
              "        shell: bash\n"
              "        run: |\n"
          )
          if marker not in src:
              raise SystemExit("FROZEN_PRODUCTION_RUN_BLOCK_NOT_FOUND")

          block = src.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith("          "):
                  lines.append(line[10:])
              elif line == "":
                  lines.append("")
              else:
                  break

          script = "\n".join(lines).rstrip() + "\n"
          event_expr = "$" + "{{ github.event_name }}"
          old = f'if [[ "{event_expr}" == "workflow_dispatch" ]]; then'
          new = 'if [[ "${PHILIPPOV_SMOKE_REQUEST:-false}" == "true" ]]; then'
          if old not in script:
              raise SystemExit("FROZEN_PRODUCTION_SMOKE_MARKER_NOT_FOUND")
          script = script.replace(old, new, 1)

          out.write_text(script, encoding="utf-8")
          print("FROZEN PRODUCTION SCRIPT: READY")
          PY

          bash "$EXEC_SCRIPT"
