name: PHILIPPOV NEXTACTION — ONE-SHOT PRODUCTION DISPATCH

on:
  push:
    paths:
      - '.github/workflows/nextaction_lifecycle_dispatch_once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch production sensor once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/max_observer_production.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME:-main}"
          echo "NEXTACTION PRODUCTION DISPATCH: PASS"
